name: Scrapline APK

on:
  push:
    paths:
      - 'scrapline/**'
      - '.github/workflows/scrapline-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scrapline/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web bundle and sync Android project
        run: npm run android

      - name: Assemble debug APK
        working-directory: scrapline/android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: scrapline-debug-apk
          path: scrapline/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
